<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgBordeaux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17" />
      <stop offset="50%" stop-color="#67001A" />
      <stop offset="100%" stop-color="#800020" />
    </linearGradient>
    <linearGradient id="accentBordeaux" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="100%" stop-color="#A31D45" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle / App Icon Rounded Rect -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgBordeaux)" filter="url(#softShadow)" />

  <!-- Subtle Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" />

  <!-- Clipboard / Document Body -->
  <g transform="translate(106, 80)">
    <!-- Clipboard Board -->
    <rect x="20" y="50" width="260" height="320" rx="24" fill="#FFFFFF" fill-opacity="0.96" filter="url(#softShadow)" />
    
    <!-- Top Clip Holder -->
    <rect x="90" y="32" width="120" height="36" rx="10" fill="#4A0E17" />
    <circle cx="150" cy="50" r="8" fill="#FFFFFF" fill-opacity="0.8" />

    <!-- Document Header Accent Bar -->
    <rect x="50" y="100" width="80" height="12" rx="6" fill="#800020" />
    <rect x="140" y="100" width="110" height="12" rx="6" fill="#E2E8F0" />

    <!-- Task Item 1 (Completed with Checkmark) -->
    <circle cx="65" cy="155" r="16" fill="#800020" />
    <path d="M58 155 L63 160 L73 149" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="95" y="149" width="155" height="12" rx="6" fill="#4A0E17" fill-opacity="0.85" />

    <!-- Task Item 2 (Completed with Checkmark) -->
    <circle cx="65" cy="205" r="16" fill="#800020" />
    <path d="M58 205 L63 210 L73 199" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="95" y="199" width="130" height="12" rx="6" fill="#4A0E17" fill-opacity="0.85" />

    <!-- Task Item 3 (In Progress) -->
    <circle cx="65" cy="255" r="16" fill="#F1F5F9" stroke="#800020" stroke-width="3" />
    <circle cx="65" cy="255" r="5" fill="#800020" />
    <rect x="95" y="249" width="145" height="12" rx="6" fill="#64748B" />

    <!-- Task Item 4 (Pending) -->
    <circle cx="65" cy="305" r="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5" />
    <rect x="95" y="299" width="110" height="12" rx="6" fill="#94A3B8" />

    <!-- Pro Badge / Floating Wine Tag -->
    <g transform="translate(195, 310)">
      <rect x="0" y="0" width="95" height="42" rx="14" fill="url(#accentBordeaux)" filter="url(#softShadow)" />
      <text x="47" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PRO</text>
    </g>
  </g>
</svg>
